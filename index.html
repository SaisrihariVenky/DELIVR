<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>DELIVR - Real-Time Food Delivery</title>
    <meta name="description" content="Real-time food delivery application with live order tracking, GPS courier movement, interactive menus, and driver messaging." />
    <meta property="og:title" content="DELIVR - Real-Time Food Delivery" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
      // Handle GitHub Pages SPA redirect
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #faf8f5; color: #2c201a; text-align: center; padding: 24px;">
        <div style="width: 64px; height: 64px; border-radius: 20px; background-color: #ff6600; display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; box-shadow: 0 10px 25px -5px rgba(255, 102, 0, 0.3); margin-bottom: 20px;">
          🛵
        </div>
        <h1 style="margin: 0 0 8px 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">DELIVR</h1>
        <p style="margin: 0; font-size: 14px; color: #7d7168; max-width: 280px; line-height: 1.5;">Freshness delivered with a moment of delight.</p>
        <noscript>
          <p style="color: #b3261e; font-size: 13px; margin-top: 16px; font-weight: 600;">Please enable JavaScript to view this application.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
